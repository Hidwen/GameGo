<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tictactoe.css">
    <title>Tic Tac Toe</title>
    <script src="tictactoe.js" defer></script>
</head>
<body>

    <div class="scoreboard">
        <div class="score-box">
            <span class="score-label">X Wins</span>
            <span class="score-value" id="scoreX">0</span>
        </div>
        <div class="score-box">
            <span class="score-label">Draws</span>
            <span class="score-value" id="scoreDraw">0</span>
        </div>
        <div class="score-box">
            <span class="score-label">O Wins</span>
            <span class="score-value" id="scoreO">0</span>
        </div>
        <button id="resetScoreButton">Reset Scores</button>
    </div>


    <div class="board o" id="board">
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
    </div> 

    <div class="win-line" id="winLine"></div>

   
    <div class="winning-message" id="winningMessage">
        <div class="winning-card">
            <div class="winning-text" data-winning-message-text></div>
            <button id="restartButton">Restart</button>
        </div>
    </div>
</body>
</html>
